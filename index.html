<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมต่อภาพคูณเลข ป.6</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4ff;--card:#fff;--ink:#12307a;--pink:#ff4f93;--yel:#ffd53d;--blue:#3b82f6;--ok:#22b573;--slot:#f4f9ff;--line:#a9ccf5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b3a;--card:#1a2a55;--ink:#eaf1ff;--slot:#223466;--line:#4a66a8}}
:root[data-theme="dark"]{--bg:#0f1b3a;--card:#1a2a55;--ink:#eaf1ff;--slot:#223466;--line:#4a66a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mali','Sarabun','Noto Sans Thai',sans-serif;min-height:100vh;
background-image:radial-gradient(circle at 10% 10%,#ffd53d33 0 80px,transparent 81px),radial-gradient(circle at 90% 30%,#ff4f9322 0 110px,transparent 111px)}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
h1{margin:6px 0 2px;text-align:center;font-size:clamp(22px,6vw,32px);color:var(--pink);text-shadow:2px 2px 0 var(--yel)}
.sub{text-align:center;margin:0 0 10px;font-size:14px}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card);border:3px solid var(--yel);border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--card);padding:8px;border-radius:22px;border:4px solid var(--blue);box-shadow:0 6px 0 #2b5fc0}
.slot{aspect-ratio:204.8/219.43;border-radius:10px;background:var(--slot);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;
font-weight:700;font-size:clamp(13px,4vw,20px);cursor:pointer;position:relative;background-size:500% 700%;transition:transform .15s}
.slot.glow{animation:glow .8s 3;border-color:var(--pink)}
.slot.done{border:2px solid #fff;cursor:default;animation:pop .4s}
.slot.done span{display:none}
.slot.shake{animation:shake .35s;background:#ffd6e5;border-color:var(--pink)}
.slot span small{display:block;font-size:.6em;opacity:.6}
.tag{position:absolute;left:2px;bottom:2px;background:#ffffffd9;color:#12307a;border-radius:8px;font-size:10px;padding:0 4px;display:none}
.slot.done .tag{display:block}
h2{font-size:16px;margin:14px 4px 6px}
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--card);border-radius:18px;padding:10px;border:3px dashed var(--yel);min-height:70px}
.pc{width:calc((100% - 36px)/7);min-width:44px;max-width:70px;aspect-ratio:204.8/219.43;border-radius:8px;background-size:500% 700%;position:relative;cursor:grab;border:3px solid #fff;box-shadow:0 2px 0 #0003;touch-action:manipulation}
.pc b{position:absolute;inset:auto 0 0 0;text-align:center;background:var(--pink);color:#fff;font-size:13px;border-radius:0 0 4px 4px;line-height:1.3}
.pc.sel{outline:4px solid var(--yel);transform:translateY(-4px) scale(1.08);z-index:2}
.btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:8px 18px;color:#fff;background:var(--blue);box-shadow:0 4px 0 #2b5fc0;cursor:pointer}
button.p{background:var(--pink);box-shadow:0 4px 0 #c42d6c}
button:active{transform:translateY(3px);box-shadow:none}
.msg{text-align:center;min-height:24px;margin:8px 0 0;font-weight:700}
.win{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.win.on{display:flex}
.win div{background:var(--card);border:5px solid var(--yel);border-radius:26px;padding:22px;text-align:center;max-width:340px}
.win h3{margin:0 0 6px;color:var(--pink);font-size:26px}
.conf{position:fixed;top:-20px;font-size:24px;animation:fall 2.5s linear forwards;z-index:10;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes glow{50%{box-shadow:0 0 0 5px var(--yel)}}
</style>
</head>

<div class="wrap">
<h1>🧮 ต่อภาพคูณเลข ป.6</h1>

const E={4:[2,2],6:[2,3],8:[2,4],9:[3,3],10:[2,5],12:[3,4],14:[2,7],15:[3,5],16:[8,2],18:[2,9],20:[4,5],21:[3,7],22:[2,11],24:[3,8],25:[5,5],27:[3,9],28:[4,7],30:[5,6],32:[4,8],33:[3,11],35:[5,7],36:[4,9],40:[5,8],42:[6,7],45:[5,9],48:[6,8],49:[7,7],54:[6,9],55:[5,11],56:[7,8],60:[5,12],63:[7,9],64:[8,8],72:[8,9],81:[9,9]};
const vals=Object.keys(E).map(Number);
const $=id=>document.getElementById(id);
let target,placed,sel,ok,bad,sec,timer;
const pos=i=>`${(i%5)/4*100}% ${Math.floor(i/5)/6*100}%`;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
 target=shuffle(vals.slice());placed=Array(35).fill(false);sel=null;ok=0;bad=0;sec=0;
 $('ok').textContent=0;$('bad').textContent=0;$('t').textContent=0;$('win').classList.remove('on');
 clearInterval(timer);timer=setInterval(()=>{sec++;$('t').textContent=sec},1000);
 const b=$('board');b.innerHTML='';
 target.forEach((v,i)=>{
  const s=document.createElement('div');s.className='slot';s.dataset.i=i;
  s.innerHTML=`<span>${E[v][0]} × ${E[v][1]}<small>= ?</small></span><i class="tag">${E[v][0]}×${E[v][1]}=${v}</i>`;
  s.onclick=()=>drop(i);
  s.ondragover=e=>e.preventDefault();
  s.ondrop=e=>{e.preventDefault();const p=e.dataTransfer.getData('text');if(p!=='')drop(i,+p)};
  b.appendChild(s)});
 const t=$('tray');t.innerHTML='';
 target.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v).forEach(({v,i})=>{
  const p=document.createElement('div');p.className='pc';p.id='pc'+i;p.draggable=true;
  p.style.backgroundImage=`url(${IMG})`;p.style.backgroundSize='500% 700%';p.style.backgroundPosition=pos(i);
  p.innerHTML=`<b>${v}</b>`;
  p.onclick=()=>{document.querySelectorAll('.pc.sel').forEach(x=>x.classList.remove('sel'));if(sel===i){sel=null}else{sel=i;p.classList.add('sel')}};
  p.ondragstart=e=>{e.dataTransfer.setData('text',i);sel=i};
  t.appendChild(p)});
 $('msg').textContent='แตะชิ้นภาพ แล้วแตะช่องที่ผลคูณตรงกัน (ลากวางก็ได้)';
}
function drop(slot,piece){
 if(piece===undefined)piece=sel;
 if(piece===null||placed[slot])return;
 const s=document.querySelector(`.slot[data-i="${slot}"]`);
 if(piece===slot){
  placed[slot]=true;ok++;sel=null;$('ok').textContent=ok;
  s.classList.remove('glow');s.classList.add('done');s.style.backgroundImage=`url(${IMG})`;s.style.backgroundPosition=pos(slot);
  const p=$('pc'+piece);if(p)p.remove();
  $('msg').textContent=['ถูกต้อง! 🌟','เยี่ยมไปเลย! 👏','เก่งมาก! ✨','ใช่เลย! 🎯'][ok%4];
  if(ok===35)finish();
 }else{
  bad++;$('bad').textContent=bad;s.classList.add('shake');setTimeout(()=>s.classList.remove('shake'),400);
  $('msg').textContent=`ยังไม่ใช่นะ ลองคิดผลคูณ ${E[target[slot]][0]} × ${E[target[slot]][1]} ใหม่ 🤔`;
 }
}
function finish(){
 clearInterval(timer);
 $('wt').textContent=`ใช้เวลา ${sec} วินาที พลาด ${bad} ครั้ง ${bad<=3?'⭐⭐⭐':bad<=8?'⭐⭐':'⭐'}`;
 $('win').classList.add('on');
 for(let i=0;i<40;i++){const c=document.createElement('div');c.className='conf';c.textContent=['🎉','⭐','✨','🧮','💖'][i%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}
}
$('hint').onclick=()=>{
 if(sel===null){$('msg').textContent='เลือกชิ้นภาพก่อน แล้วกดใบ้นะ 💡';return}
 const s=document.querySelector(`.slot[data-i="${sel}"]`);if(s){s.classList.add('glow');setTimeout(()=>s.classList.remove('glow'),2500)}
};
$('reset').onclick=start;$('again').onclick=start;
start();
</script>
